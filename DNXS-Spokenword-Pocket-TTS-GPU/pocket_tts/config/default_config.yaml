chunking:
  mode: sentence
  min_words: 4
  target_words: 50
  respect_boundaries: true
tts_core:
  temperature: 0.6
  eos_threshold: -3.0
  frames_after_eos: 2
emotion:
  enabled: true
  model: j-hartmann/emotion-english-distilroberta-base
  mappings:
    joy:
      temperature: 0.9
      speed_factor: 1.0
    surprise:
      temperature: 0.85
      speed_factor: 1.1
    anger:
      temperature: 0.8
      speed_factor: 0.95
    neutral:
      temperature: 0.7
      speed_factor: 1.0
    sadness:
      temperature: 0.65
      speed_factor: 0.9
    fear:
      temperature: 0.6
      speed_factor: 0.9
    disgust:
      temperature: 0.65
      speed_factor: 0.95
  keyword_boosts:
    joy:
      keywords:
      - ecstatic
      - thrilled
      - delighted
      temperature_boost: 0.03
      speed_boost: 0.02
    anger:
      keywords:
      - enraged
      - infuriated
      - outraged
      temperature_boost: 0.05
      speed_boost: 0.03
pauses:
  base_durations:
    sentence_end: 400
    paragraph_break: 700
    chapter_start: 1000
    question_mark: 240
    exclamation: 80
    ellipsis: 320
  emotion_multipliers:
    anger: 1.3
    fear: 1.2
    sadness: 1.4
    joy: 0.9
    neutral: 1.0
speed_variation:
  enabled: false
  method: librosa
  range: 0.1
  emotion_speed_modifiers:
    joy: 0.03
    surprise: 0.05
    anger: 0.07
    sadness: -0.07
    fear: -0.05
    disgust: -0.05
    neutral: 0.0
m4b:
  write_m4b: true
  write_mp3: false
  write_wav: false
  enabled: true
  speed: 1.0
  sample_rate: 24000
  normalization_type: peak
  target_db: -1.5
  chapterize: true
  max_chapter_minutes: 15
  chapter_mode: headings_or_minutes
  metadata:
    author: ''
    series: ''
    series_number: ''
    title: ''
    composer: ''
    year: ''
    genre: ''
    artist: Dnxs Spokenword PocketGPU
    description: ''
    cover_path: ''
mitigation:
  short_sentence_threshold: 5
  temperature_short_sentence: 0.5
asr_quality_control:
  enabled: true
  pipeline: legacy
  second_stage_model: medium
  alignment_diagnostic_enabled: false
  engine: whisper_cpp
  model: base
  language: en
  asr_threshold: 0.68
  max_retries: 3
  temp_decrement: 0.1
  regeneration_strategy: staged_three_candidates
  regen_tts_workers: 2
  regen_tts_batch_size: 2
  regen_worker_start_gap_s: 2.0
  device_policy: gpu_after_tts
  parallel:
    cpu_workers: 4
    gpu_workers: 0
    gpu_workers_after_tts: 4
    n_threads: 0
  worker_calibration:
    done: true
    recommended: 4
    last_run: '2026-07-28T07:04:19'
  threshold: 0.6
  regen_asr_model: medium
  regen_keep_tts_resident: false
  regen_plan:
    gui_asr_model: base
    verification_required: true
    verification_model: medium
    regen_asr_model: medium
    tts_workers: 1
    tts_batch_size: 1
    asr_workers: 1
    asr_batch_size: 1
    keep_tts_resident: false
    concurrent: false
    accumulate_failures: false
    peak_vram_mb: null
    chosen_strategy: fallback_sequential
    benchmark_source: fallback
    benchmark_rows:
    - name: resident_medium_recovery
      wall_s: 11.066
      source: resident_asr_recovery/20260730-082338/summary.json
      workload: regeneration
      tts_workers: 1
      tts_batch_size: 1
      asr_workers: 1
      asr_batch_size: 1
      keep_tts_resident: true
      concurrent: false
      accumulate_failures: false
      peak_vram_mb: null
      rejected_reason: null
    rejected_strategies:
    - resident_medium_recovery (missing_peak_vram)
    notes:
    - No safe comparable recovery benchmark row is available; using conservative staged
      recovery.
    - TTS unloads before initial GUI ASR, then one worker is reloaded for regeneration.
  _regen_voice_path: fantine
  stage_one:
    schedule: postgen
    engine: faster_whisper
  device: cuda
parallel:
  enabled: true
  max_workers: 2
  min_workers: 1
  ram_limit_percent: 85
  load_threshold: 8.0
  worker_vram_gb: 1.0
  vram_reserve_percent: 10.0
  vram_startup_reserve_percent: 5.0
  adaptive_workers: false
gui:
  theme: system
  auto_save_interval: 30
  max_preview_chunks: 50
  default_output_format: wav
debug:
  log_level: INFO
  save_intermediate: false
  profile_performance: false
batch_generation:
  enabled: true
  batch_size: 4
  max_padding_ratio: 0.0
  batch_regeneration: false
cuda_graphs:
  enabled: true
  fallback_eager: true
device:
  auto: true
  preferred: cuda
  max_nb_tokens_in_a_chunk: 50
quality:
  lsd_steps: 5
pause_injection:
  enabled: false
  punctuation_durations:
    .: 0.4
    '!': 0.25
    '?': 0.5
    ',': 0.0
    '...': 0.3
    --: 0.1
    ;: 0.15
    ':': 0.2
audio_cleanup:
  enabled: true
  use_silero_vad: true
  speech_endpoint_threshold: 0.004
  trimming_buffer_ms: 100
  async: true
  max_pending: 12
